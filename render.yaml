services:
  - type: web
    name: realtime-conversational-agent-server
    env: python
    plan: free
    pythonVersion: "3.11"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn -w 4 -k uvicorn.workers.UvicornWorker main:app"
    healthCheckPath: /
    envVars:
      - key: APP_NAME
        value: realtime-conversational-agent
      - key: GOOGLE_API_KEY
        fromSecretFile: ".env"

  - type: web
    name: realtime-conversational-agent-client
    plan: free
    env: static
    buildCommand: "cd client && npm install && npm run build"
    staticPublishPath: "./client/out"
    envVars:
      - key: NEXT_PUBLIC_WEBSOCKET_URL
        fromService:
          type: web
          name: realtime-conversational-agent-server
          property: url
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
